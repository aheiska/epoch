[package]
name = "epoch"
version = "0.3.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = { version = "0.10.4", default-features = false }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
